# Veröffentlicht die Vorstellungsseite (malipin.com) bei jedem Push auf main.
# Einmalig nötig: GitHub -> Settings -> Pages -> Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ohne Impressum wird nichts veröffentlicht (und es gibt keine Fehler-Mail)
      - id: check
        run: |
          if [ -f website/impressum.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "Noch kein website/impressum.json - Seite wird nicht veroeffentlicht."; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'true'
        run: python -m scripts.build_site
      - if: steps.check.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.check.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
