<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="mali-lib.js"></script>
<script>
// Herbstpark, filmischer Look (warme Farben, Filmkorn, Untertitel, volles 9:16-Bild): Mali friert ohne Jacke und
// fragt Creator, wo die Jacke her ist. Nachrichten steigen als Blasen aus dem Handy. Kein Name,
// keine Lösung. ?lang=en
LEN = 14.2;
Object.assign(EN, {
  "hallo? 🥺": "hello? 🥺", "Gesehen": "Seen",
  "4 grad. keine jacke.": "4°C. no jacket.", "bitte?? 🥺": "please?? 🥺", "ist leider ausverkauft 🥰": "it's sold out sorry 🥰", "wo ist die jacke her?? 🥺": "where is the jacket from?? 🥺",
  "danke 🥰": "thanks 🥰", "danke.": "thank u.", "und der mantel?? 🙏": "and the coat?? 🙏", "vintage 💅": "vintage 💅",
  "natürlich.": "of course.", "jacke pls 😭": "jacket pls 😭", "link in bio ✨": "link in bio ✨",
  "die bio sagt manifesting.": "the bio says manifesting.", "hey 🥺": "hey 🥺", "hallo?": "hello?", "mir ist kalt": "i'm cold",
  "ich zahl dir 5 €": "i'll pay u €5", "gesehen 23:02": "seen 23:02", "gesehen. 23:02.": "seen. 23:02.",
  "warum fragt ihr eigentlich immer": "why do you guys always ask", "wo meine sachen her sind 🙄": "where my stuff is from 🙄",
  "hatschi.": "achoo.", "immer noch keine jacke.": "still no jacket.",
  "3 wochen später.": "3 weeks later.", "ist von einem kleinen laden": "it's from a tiny shop",
  "in kopenhagen 🥰": "in copenhagen 🥰", "leider ausverkauft": "sold out tho", "wo ist der mantel her?? 🥺": "where is the coat from?? 🥺",
  "und morgen wieder.": "and again tomorrow.",
});

const punch = (t, at, len = 0.22) => (t >= at && t < at + len) ? 1 - (t - at) / len : 0;
function txt(str, x, y, size, color, weight = 600, align = "left") {
  ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillText(tr(str), x, y);
}
const typed = (t, s, from, to) => { const str = [...tr(s)]; return str.slice(0, Math.floor(str.length * prog(t, from, to))).join(""); };

// ---------- Wind ----------
const GUSTS = [[0.1, 1.0], [3.5, 0.5], [6.4, 0.9], [9.5, 0.5]];   // [Zeit, Stärke]
const gust = (t) => GUSTS.reduce((a, [at, s]) => a + s * Math.exp(-((t - at - 0.35) ** 2) / 0.12), 0);
const drift = (t) => t * 60 + GUSTS.reduce((a, [at, s]) => a + s * 700 * clamp((t - at) / 0.8), 0);   // aufsummierter Wind

// ---------- Herbstpark (illustriert) ----------
function tree(x, groundY, h, r, palette, sway) {
  ctx.fillStyle = "#6b4433"; ctx.beginPath();
  ctx.moveTo(x - r * 0.12, groundY); ctx.lineTo(x - r * 0.07, groundY - h); ctx.lineTo(x + r * 0.07, groundY - h); ctx.lineTo(x + r * 0.12, groundY); ctx.fill();
  ctx.strokeStyle = "#6b4433"; ctx.lineWidth = r * 0.06;
  ctx.beginPath(); ctx.moveTo(x, groundY - h * 0.6); ctx.lineTo(x - r * 0.45, groundY - h * 0.9); ctx.moveTo(x, groundY - h * 0.7); ctx.lineTo(x + r * 0.4, groundY - h); ctx.stroke();
  const blobs = [[0, -1.05, 0.62], [-0.48, -0.85, 0.5], [0.5, -0.88, 0.5], [-0.25, -1.35, 0.48], [0.3, -1.3, 0.46], [0, -0.7, 0.5]];
  blobs.forEach(([dx, dy, rr], i) => {
    const bx = x + dx * r + sway * (1 + dy * -0.3), by = groundY - h * 0.45 + dy * r;
    ctx.fillStyle = palette[i % palette.length]; ctx.beginPath(); ctx.arc(bx, by, rr * r, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,240,200,.18)"; ctx.beginPath(); ctx.arc(bx - rr * r * 0.3, by - rr * r * 0.3, rr * r * 0.5, 0, 7); ctx.fill();
  });
}
function park(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, 1200);
  sky.addColorStop(0, "#ffcfa0"); sky.addColorStop(0.55, "#ffb594"); sky.addColorStop(1, "#f7a9a3");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const sun = ctx.createRadialGradient(800, 640, 20, 800, 640, 260);
  sun.addColorStop(0, "rgba(255,246,214,1)"); sun.addColorStop(0.25, "rgba(255,240,200,.9)"); sun.addColorStop(1, "rgba(255,230,190,0)");
  ctx.fillStyle = sun; ctx.fillRect(500, 340, 600, 600);
  for (let i = 0; i < 4; i++) {                                       // Wolken ziehen
    const cx = ((i * 330 + t * (18 + gust(t) * 40)) % 1500) - 200, cy = 250 + i * 110;
    ctx.fillStyle = "rgba(255,247,238,.55)";
    for (const [dx, dy, r] of [[0, 0, 60], [55, -20, 50], [105, 5, 45], [-50, 8, 42]]) { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r, 0, 7); ctx.fill(); }
  }
  // ferne Bäume
  for (let i = 0; i < 12; i++) {
    ctx.fillStyle = ["#e59a74", "#de8a6a", "#e8a77c"][i % 3];
    ctx.beginPath(); ctx.arc(i * 100 - 20, 1040 + (i % 3) * 14, 90 + (i % 2) * 25, 0, 7); ctx.fill();
  }
  // Wiese + Weg
  const grass = ctx.createLinearGradient(0, 1060, 0, H);
  grass.addColorStop(0, "#c8b06c"); grass.addColorStop(1, "#9c8a50");
  ctx.fillStyle = grass; ctx.fillRect(0, 1060, W, H);
  ctx.fillStyle = "#e8d3b0"; ctx.beginPath();
  ctx.moveTo(470, 1070); ctx.lineTo(610, 1070); ctx.bezierCurveTo(700, 1300, 900, 1550, 1000, 1920); ctx.lineTo(160, 1920); ctx.bezierCurveTo(330, 1550, 440, 1300, 470, 1070); ctx.fill();
  const sway = Math.sin(t * 2) * 6 + gust(t) * 22;
  tree(130, 1120, 520, 300, ["#e8743b", "#f2a541", "#d9534f", "#f6c453", "#e2622f", "#f08a3c"], sway);
  tree(980, 1110, 560, 320, ["#f6c453", "#e8743b", "#c94b3c", "#f2a541", "#e2622f", "#f08a3c"], sway * 1.1);
  tree(760, 1080, 260, 130, ["#f2a541", "#e8743b", "#f6c453"], sway * 0.6);
  // Laterne
  ctx.fillStyle = "#3f4a43"; ctx.fillRect(296, 780, 14, 330); ctx.fillRect(270, 1100, 66, 16);
  ctx.fillStyle = "#3f4a43"; round(272, 730, 62, 60, 10); ctx.fill();
  ctx.fillStyle = "#ffe9a8"; round(282, 742, 42, 38, 6); ctx.fill();
  // Laub am Boden
  for (let i = 0; i < 70; i++) {
    const x = (i * 157) % W, y = 1120 + ((i * 89) % 780);
    ctx.save(); ctx.translate(x, y); ctx.rotate(i);
    ctx.fillStyle = ["#e8743b", "#d9534f", "#f2a541", "#b5482f", "#f6c453"][i % 5]; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}
// fallende / wehende Blätter (vorne)
function leaves(t, count = 26, front = false) {
  const d = drift(t);
  for (let i = 0; i < count; i++) {
    const seed = i * 97.3 + (front ? 13 : 0);
    const x = ((seed * 7 + d * (0.8 + (i % 5) * 0.12)) % 1300) - 110;
    const y = ((seed * 5 + t * (70 + (i % 4) * 25)) % 1500) + 250 + Math.sin(t * 2 + i) * 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (1.5 + (i % 3)) + i);
    const s = front ? 1.7 : 1;
    ctx.fillStyle = ["#e8743b", "#d9534f", "#f2a541", "#f6c453", "#c94b3c"][i % 5];
    ctx.beginPath(); ctx.ellipse(0, 0, 16 * s, 8 * s, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(90,50,30,.5)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-16 * s, 0); ctx.lineTo(18 * s, 0); ctx.stroke();
    ctx.restore();
  }
}
function windLines(t) {
  const g = gust(t);
  if (g < 0.15) return;
  ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.75, g * 0.7)})`; ctx.lineWidth = 6; ctx.lineCap = "round";
  for (let i = 0; i < 6; i++) {
    const y = 980 + i * 90, x = ((t * 1400 + i * 300) % 1400) - 200;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.bezierCurveTo(x + 80, y - 20, x + 140, y + 20, x + 220, y); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Mali steht im Laub (kleine Pixel-Mali) ----------
MALI.sneeze = mk({ 8: ".owkwwwwwwwwkwo.", 9: ".owbkwwwwwwkbwo.", 10: ".owwwwwkkwwwwwo." });
const S = 22, MY = 1230;
function maliAt(t, face, { push = 0, shiver = 0, leaf = false } = {}) {
  const cx = W / 2 + push + Math.sin(t * 70) * shiver, cy = MY;
  ctx.fillStyle = "rgba(60,30,20,.22)"; ctx.beginPath(); ctx.ellipse(W / 2 + push, cy + 8.6 * S, 150, 22, 0, 0, 7); ctx.fill();
  const g = 0.4 + gust(t);                                        // Schalzipfel im Wind
  for (let k = 0; k < 5; k++) {
    const sx = cx + 4 * S + k * 26 * g, sy = cy + 3.2 * S + Math.sin(t * 10 + k) * 9 * g + k * 5;
    ctx.fillStyle = k % 2 ? "#9e3328" : "#c8493c"; ctx.fillRect(sx, sy, 28, 22);
  }
  mali(cx, cy, S, face);
  ctx.fillStyle = "#c8493c"; ctx.fillRect(cx - 5 * S, cy + 3 * S, 10 * S, S);              // Schal
  ctx.fillStyle = "#9e3328"; for (let k = -4; k < 5; k += 2) ctx.fillRect(cx + k * S, cy + 3 * S, S / 2, S);
  ctx.fillStyle = "#c8493c"; ctx.fillRect(cx + 2 * S, cy + 4 * S, S, 2 * S);
  ctx.fillStyle = "#ff5a6e"; ctx.fillRect(cx - S, cy + 2 * S, 2 * S, S);                    // Kältenase
  const px = cx, py = cy + 5.4 * S;                                                          // Handy
  ctx.fillStyle = "#231c20"; round(px - 30, py - 46, 60, 92, 10); ctx.fill();
  ctx.fillStyle = "#dfe7ff"; round(px - 24, py - 40, 48, 80, 7); ctx.fill();
  ctx.fillStyle = "#fffaf6"; ctx.strokeStyle = "#6b5656"; ctx.lineWidth = 6;
  for (const dx of [-38, 38]) { ctx.beginPath(); ctx.arc(px + dx, py + 14, 20, 0, 7); ctx.fill(); ctx.stroke(); }
  if (leaf) {
    ctx.save(); ctx.translate(cx - 2.5 * S, cy + 1 * S); ctx.rotate(-0.5);
    ctx.fillStyle = "#e8743b"; ctx.beginPath(); ctx.ellipse(0, 0, 66, 36, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(90,50,30,.6)"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-66, 0); ctx.lineTo(74, 0); ctx.stroke(); ctx.restore();
  }
  return { x: px, y: py - 50 };
}

// ---------- Chat-Blasen, die aus dem Handy aufsteigen ----------
// Nur zwei Wechsel: "danke" … und dann nur noch "gesehen".
const ROUNDS = [
  [1.9, 4.4, [["wo ist die jacke her?? 🥺", 1.9, true], ["danke 🥰", 2.9, false, "leather"]]],
  [4.6, 7.2, [["hallo? 🥺", 4.7, true]]],
];
function bubble(t, msg, at, mine, look, slot, phone, fade) {
  const pop = easeBack(prog(t, at, at + 0.3)), rise = easeOut(prog(t, at, at + 0.6));
  if (pop <= 0) return;
  ctx.font = `500 46px ${FONT}`;
  const tw = ctx.measureText(tr(msg)).width, bw = tw + 64, bh = 86;
  const tx = mine ? 900 - bw / 2 : 170 + bw / 2;
  const ty = 430 + slot * 116;
  const x = lerp(phone.x, tx, rise), y = lerp(phone.y, ty, rise);
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(x, y); ctx.scale(pop, pop);
  ctx.shadowColor = "rgba(60,30,20,.25)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  ctx.fillStyle = mine ? "#e8577e" : "#fbf6f2"; round(-bw / 2, -bh / 2, bw, bh, 43); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = mine ? "#fff" : "#2a1712"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(tr(msg), 0, 3);
  if (!mine && look) {
    ctx.beginPath(); ctx.arc(-bw / 2 - 48, 0, 36, 0, 7); ctx.fillStyle = LOOKS[look].bg; ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(-bw / 2 - 48, 0, 36, 0, 7); ctx.clip(); bunny(look, -bw / 2 - 48, 9, 4.8); ctx.restore();
  }
  ctx.restore();
}
function chat(t, phone) {
  for (const [from, to, msgs] of ROUNDS) {
    if (t < from || t > to) continue;
    const fade = 1 - prog(t, to - 0.3, to);
    msgs.forEach(([msg, at, mine, look], slot) => bubble(t, msg, at, mine, look, slot, phone, fade));
    if (from === 4.6 && t > 5.4) {                                 // gesehen …
      ctx.save(); ctx.globalAlpha = fade * prog(t, 5.4, 5.6); ctx.fillStyle = "#fff"; ctx.font = `600 34px ${FONT}`;
      ctx.textAlign = "right"; ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 8;
      ctx.fillText(tr("Gesehen"), 900, 430 + 76); ctx.restore();
    }
    if (from === 4.6 && between(t, 5.9, 6.5)) {                    // … tippt … und hört wieder auf
      ctx.fillStyle = "#fbf6f2"; round(170, 430 + 116 - 30, 140, 72, 36); ctx.fill();
      for (let i = 0; i < 3; i++) { ctx.fillStyle = "#9a8b93"; ctx.beginPath(); ctx.arc(208 + i * 32, 430 + 116 + 6 - Math.abs(Math.sin(t * 9 + i)) * 8, 10, 0, 7); ctx.fill(); }
    }
  }
}

// ---------- Ende: Winter, Mali immer noch ohne Jacke, scrollt weiter durch Jacken ----------
const WINTER = 7.9;
function snowflakes(t, n = 150) {
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < n; i++) {
    const x = ((i * 211.7 + t * (30 + (i % 5) * 8) + Math.sin(t + i) * 20) % 1180) - 50;
    const y = ((i * 97.3 + t * (90 + (i % 4) * 30)) % 1980) - 30, r = 3 + (i % 3) * 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
}
const JACKET = ["...XX..XX...", "..XXXwwXXX..", ".XXXXwwXXXX.", "XXXXXwwXXXXX", "XXXXXwwXXXXX",
                "XX.XXwwXX.XX", "XX.XXwwXX.XX", "XX.XXwwXX.XX", "XX.XXXXXX.XX", "...XXXXXX..."];
const COAT = ["...XX..XX...", "..XXXXXXXX..", ".XXXXXXXXXX.", "XXXXXXXXXXXX", "XX.XXXXXX.XX",
              "XX.XXXXXX.XX", "XX.XXXXXX.XX", "XX.XXXXXX.XX", "...XXXXXX...", "...XXXXXX...", "...XX..XX..."];
const FEED_ITEMS = [[JACKET, "#1e1a1d", "#f3e7ee"], [COAT, "#c9a27a", "#f1ebe2"], [JACKET, "#7fa0c8", "#e3ebf5"],
                    [COAT, "#3b4a5c", "#eef0f6"], [JACKET, "#c8493c", "#fde2ea"], [COAT, "#e8d9c4", "#f6efe5"],
                    [JACKET, "#6b7048", "#eef1e4"], [COAT, "#2b2228", "#f3e7ee"]];
function jacketFeed(t, ph, alpha) {
  if (alpha <= 0) return;
  const PX = 200, PY = 250, PW = 680, PH = 760;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(255,255,255,.45)";                                           // Zoom-Spitze zum Handy
  ctx.beginPath(); ctx.moveTo(W / 2 - 80, PY + PH - 4); ctx.lineTo(W / 2 + 80, PY + PH - 4); ctx.lineTo(ph.x, ph.y); ctx.fill();
  ctx.save(); ctx.shadowColor = "rgba(30,40,70,.35)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = "#231c20"; round(PX, PY, PW, PH, 48); ctx.fill(); ctx.restore();
  ctx.save(); round(PX + 12, PY + 12, PW - 24, PH - 24, 38); ctx.clip();
  ctx.fillStyle = "#fff7fa"; ctx.fillRect(PX, PY, PW, PH);
  const scroll = (t - WINTER) * 260, cw = (PW - 24 - 42) / 2;                        // scrollt endlos weiter
  for (let i = 0; i < 24; i++) {
    const col = i % 2, ch = 230 + (i % 3) * 40;
    const y = PY + 80 + Math.floor(i / 2) * 290 + (col ? 110 : 0) - scroll;
    if (y > PY + PH || y + ch < PY) continue;
    const x = PX + 24 + col * (cw + 18), [rows, color, bg] = FEED_ITEMS[i % FEED_ITEMS.length];
    ctx.fillStyle = bg; round(x, y, cw, ch, 20); ctx.fill();
    pixels(rows, x + cw / 2 - rows[0].length * 7, y + ch / 2 - rows.length * 7 - 14, 14, { X: color, w: "#fffaf6" });
    heart(x + 30, y + ch - 26, 3.5);
  }
  ctx.fillStyle = "#e60023"; ctx.beginPath(); ctx.arc(PX + PW / 2, PY + 46, 16, 0, 7); ctx.fill();   // Pinterest-Punkt
  ctx.restore(); ctx.restore();
}
// Riesige Schneekugel rollt heran, nimmt Mali mit, nur das Handy bleibt im Schnee
const ROLL = 11.7, HIT = 12.25, GONE = 13.2, R = 270;
function snowball(t) {
  if (t < ROLL || t > GONE + 0.2) return;
  const x = t < HIT ? lerp(-R - 40, W / 2 - 60, easeOut(prog(t, ROLL, HIT)) * 0.4 + prog(t, ROLL, HIT) * 0.6)
                    : lerp(W / 2 - 60, W + R + 80, prog(t, HIT, GONE));
  const y = MY + 8 * S - R + 24, rot = x / R;
  ctx.fillStyle = "rgba(90,110,150,.22)"; ctx.beginPath(); ctx.ellipse(x, y + R - 10, R * 0.95, 34, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(170,190,225,.45)"; ctx.beginPath(); ctx.arc(R * 0.18, R * 0.2, R * 0.85, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(-R * 0.12, -R * 0.12, R * 0.8, 0, 7); ctx.fill();
  ctx.rotate(rot);
  ctx.strokeStyle = "rgba(160,180,215,.7)"; ctx.lineWidth = 10; ctx.lineCap = "round";     // Roll-Spuren
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(0, 0, R * (0.35 + i * 0.15), i, i + 1.2); ctx.stroke(); }
  ctx.restore();
  if (t > HIT) {                                     // Mali steckt drin: Ohren und Füßchen rollen mit der Kugel
    if (!snowball.ears) {                            // Ohren einmal als kleines Bild (dreht sich ohne Pixel-Streifen)
      const c = document.createElement("canvas"); c.width = 16; c.height = 6;
      const g = c.getContext("2d");
      MALI.idle.slice(0, 6).forEach((row, r) => [...row].forEach((ch, col) => { if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(col, r, 1, 1); } }));
      snowball.ears = c;
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(snowball.ears, -8 * S, -R - 4.6 * S, 16 * S, 6 * S);
    ctx.fillStyle = "#fffaf6"; ctx.strokeStyle = "#6b5656"; ctx.lineWidth = 6;
    for (const dx of [-70, 70]) { ctx.beginPath(); ctx.ellipse(dx, R - 18 + Math.sin(t * 16 + dx) * 5, 30, 22, 0, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  if (between(t, HIT - 0.05, HIT + 0.7)) for (let i = 0; i < 16; i++) {               // Schnee spritzt
    const k = prog(t, HIT - 0.05, HIT + 0.7), a = -Math.PI * (0.1 + 0.8 * (i / 15));
    ctx.fillStyle = `rgba(255,255,255,${1 - k})`;
    ctx.beginPath(); ctx.arc(W / 2 + Math.cos(a) * 420 * k, MY + 120 + Math.sin(a) * 380 * k + 300 * k * k, 18 - i % 3 * 4, 0, 7); ctx.fill();
  }
}
function droppedPhone(t) {                                                            // Handy bleibt im Schnee liegen
  const x = W / 2 + 10, y = MY + 7.4 * S;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25);
  ctx.fillStyle = "#231c20"; round(-30, -48, 60, 96, 10); ctx.fill();
  ctx.fillStyle = "#fff7fa"; round(-24, -42, 48, 84, 7); ctx.fill();
  const colors = ["#1e1a1d", "#c9a27a", "#7fa0c8", "#c8493c"];
  for (let i = 0; i < 4; i++) { ctx.fillStyle = colors[(i + Math.floor(t * 2)) % 4]; ctx.fillRect(-20 + (i % 2) * 22, -36 + Math.floor(i / 2) * 40, 18, 32); }
  ctx.restore();
  const g = ctx.createRadialGradient(x, y, 10, x, y, 140);
  g.addColorStop(0, "rgba(255,250,240,.35)"); g.addColorStop(1, "rgba(255,250,240,0)");
  ctx.fillStyle = g; ctx.fillRect(x - 150, y - 150, 300, 300);
}
function winter(t) {
  const zoom = 1.02 + prog(t, WINTER, LEN) * 0.05;
  const quake = between(t, HIT, HIT + 0.45) ? Math.sin(t * 90) * 22 * (1 - prog(t, HIT, HIT + 0.45)) : 0;
  ctx.save(); ctx.translate(W / 2 + quake, 1200); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -1200);
  park(t);
  ctx.save(); ctx.globalCompositeOperation = "saturation"; ctx.fillStyle = "rgba(128,128,128,.8)"; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.fillStyle = "rgba(205,222,255,.38)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#f3f6fc"; ctx.beginPath(); ctx.moveTo(0, 1075);                  // Schneedecke
  for (let x = 0; x <= W; x += 90) ctx.quadraticCurveTo(x + 45, 1050 + (x % 180 ? 10 : -12), x + 90, 1075);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  const face = t > ROLL - 0.3 ? "shock" : ((t % 1.9) > 1.75 ? "blink" : "idle");     // schaut aufs Handy … bis es rumpelt
  let ph = { x: W / 2, y: MY + 5.4 * S - 50 };
  if (t < HIT) {
    ph = maliAt(t, face, { shiver: 3.5 });                                           // immer noch ohne Jacke
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#b9c8e2"; ctx.lineWidth = 6;         // Schneehäubchen
    round(W / 2 - 3.2 * S, MY - 5.4 * S, 6.4 * S, 1.6 * S, S * 0.8); ctx.fill(); ctx.stroke();
  } else droppedPhone(t);
  snowball(t);
  snowflakes(t);
  jacketFeed(t, { x: ph.x, y: ph.y }, prog(t, WINTER + 0.5, WINTER + 0.9) * (1 - prog(t, ROLL - 0.4, ROLL)));
  ctx.restore();
}

// ---------- Film-Look ----------
function grade(t) {
  ctx.save(); ctx.globalCompositeOperation = "soft-light";             // Farbgebung: warm, im Winter kühl
  ctx.fillStyle = t > WINTER ? "rgba(140,180,255,.3)" : "rgba(255,150,80,.35)"; ctx.fillRect(0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, 1000, 300, W / 2, 1000, 1150);   // Vignette
  v.addColorStop(0, "rgba(30,12,8,0)"); v.addColorStop(1, "rgba(30,12,8,.4)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const frame = Math.floor(t * 30);                                    // Filmkorn
  for (let i = 0; i < 900; i++) {
    const x = (Math.sin(i * 12.9898 + frame * 78.233) * 43758.5453 % 1 + 1) % 1 * W;
    const y = (Math.sin(i * 39.346 + frame * 11.135) * 23421.631 % 1 + 1) % 1 * H;
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.08)"; ctx.fillRect(x, y, 3, 3);
  }
}

// ---------- Ablauf (ohne Untertitel) ----------
function scene(t) {
  if (t >= WINTER) { winter(t); return finish(t); }
  const zoom = 1 + prog(t, 0, WINTER) * 0.06 + gust(t) * 0.006;
  ctx.save(); ctx.translate(W / 2, 1200); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -1200);
  park(t);
  leaves(t, 22);
  windLines(t);
  let face = "tired", shiver = 1.5 + gust(t) * 4;
  if (between(t, 1.8, 2.9)) face = "idle";
  else if (between(t, 2.9, 4.6)) face = "tired";
  else if (between(t, 4.6, 5.4)) face = "idle";
  else if (between(t, 5.4, 6.9)) { face = "sad"; shiver += 2; }
  else if (between(t, 6.9, 7.2)) face = "tired";
  else if (t >= 7.2) face = "sneeze";
  const phone = maliAt(t, face, { shiver });
  leaves(t, 6, true);
  chat(t, phone);
  ctx.restore();
  finish(t);
}
function finish(t) {
  grade(t);
  const white = Math.max(0, 1 - Math.abs(t - WINTER) / 0.3);                         // weißer Übergang in den Winter
  if (white > 0) { ctx.fillStyle = `rgba(255,255,255,${white})`; ctx.fillRect(0, 0, W, H); }
  const black = Math.max(prog(t, LEN - 0.6, LEN), 1 - prog(t, 0, 0.4));              // schwarz -> Endlosschleife
  if (black > 0) { ctx.fillStyle = `rgba(11,7,6,${black})`; ctx.fillRect(0, 0, W, H); }
}

window.duration = LEN;
window.draw = (t) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); scene(t); };
window.draw(0);
</script>
