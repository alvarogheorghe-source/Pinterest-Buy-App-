<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="mali-lib.js"></script>
<script>
LEN = 14.5;
// ---------- Ablauf ----------
// 0–5.6 nachts im Bett (Feed, Traum) · 5.6–9.0 Lampe an, suchen, zu teuer · 9.0–12.5 Idee, Sonnenaufgang, Ende
function scene(t) {
  if (t < 5.6) return sceneBedSide(t);
  const sunrise = easeOut(prog(t, 11.0, 12.2));
  room(t, sunrise, true);
  const MX = W / 2, MY = 1100, S = 24;
  let face = "idle", squash = 0, hop = 0;
  const fx = [];

  let shake = 0;
  if (t < 7.6) {                                                    // überfordert: wo suchen?
    face = t < 5.9 ? "blink" : "shock";
    shake = t > 6.0 ? Math.sin(t * 60) * 5 * prog(t, 6.0, 6.6) : 0;
    fx.push(() => {
      WINDOWS.forEach(([x, y, rot], i) => {
        const at = 6.0 + i * 0.1, p = easeBack(prog(t, at, at + 0.2));
        browserWin(x + (i % 2 ? 1 : -1) * Math.sin(t * 3 + i) * 6, y, p * 0.72 * (1 - prog(t, 7.4, 7.6)), rot, i);
      });
      narrate(["*wo soll sie überhaupt", "suchen??*"], 340, { scale: easeBack(prog(t, 5.9, 6.2)) });
      const n = Math.min(37, Math.floor(prog(t, 6.0, 7.3) * 37));
      if (t > 6.1) caption([tr("37 tabs offen").replace("37", String(n))], W / 2, 500, 40, { bg: "#3a2a30", fg: "#fff", alpha: 1 - prog(t, 7.4, 7.6) });
    });
  } else if (t < 11.0) {                                            // suchen
    face = t < 9.6 ? ((t % 0.9) > 0.8 ? "blink" : "tired") : "sad";
    squash = t > 9.6 ? 0.06 * easeOut(prog(t, 9.6, 9.9)) : 0;
    fx.push(() => {
      if (t < 9.6) {
        narrate(["*sucht 3 stunden*"], 340, { scale: easeBack(prog(t, 7.6, 7.9)) });
        clock(860, 640, 66, t, 14);
      } else narrate(["*alles zu teuer*"], 340, { scale: easeBack(prog(t, 9.6, 9.9)) });
      [["189 €", 270, 760, 8.0, "#c93a69", false, -0.12], ["ausverkauft", 690, 770, 8.4, "#8c7f78", true, 0.08],
       ["249 €", 250, 900, 8.8, "#c93a69", false, 0.07], ["nur in den USA", 680, 905, 9.2, "#8c7f78", false, -0.06]]
        .forEach(([s, x, y, at, color, strike, rot]) => {
          const p = easeBack(prog(t, at, at + 0.22));
          const shake = between(t, at, at + 0.3) ? Math.sin(t * 80) * 6 : 0;
          tag(s, x + shake, y, { color, strike, scale: p, rot });
        });
      if (t > 9.7) sprite(DROP, MX + 170, 980 + ((t - 9.7) % 0.6) * 60, 9, 1 - ((t - 9.7) % 0.6) / 0.6);
    });
  } else {                                                          // die Idee
    face = (t % 1.7) > 1.6 ? "blink" : "shiny";
    hop = t > 11.4 ? Math.abs(Math.sin((t - 11.4) * 5)) * 22 * (1 - prog(t, 13.4, 14.2)) : 0;
    const b = easeBack(prog(t, 11.0, 11.25));
    fx.push(() => {
      ctx.save(); ctx.globalAlpha = 0.5 * (1 - prog(t, 11.0, 11.7));
      ctx.fillStyle = "#fff6c2"; ctx.beginPath(); ctx.arc(MX, 770, 320 * easeOut(prog(t, 11.0, 11.7)), 0, 7); ctx.fill(); ctx.restore();
      sprite(BULB, MX, 780 - hop + Math.sin(t * 3) * 6, 24 * b);
      for (let i = 0; i < 5; i++) {
        const k = ((t - 11.0) * 1.2 + i / 5) % 1;
        sprite(SPARK, MX + [-280, 290, -200, 220, 0][i], [760, 800, 960, 990, 640][i] - k * 40, 10, Math.sin(k * Math.PI));
      }
      narrate(["*hat eine idee*"], 340, { scale: easeBack(prog(t, 11.1, 11.4)), size: 86 });
    });
  }

  mali(MX + shake, MY - hop, S, face, { squash });
  bedFront(1250);
  const dark = (t < 11.0 ? 0.62 : 0.62 * (1 - sunrise)) + (between(t, 9.6, 11.0) ? 0.1 * prog(t, 9.6, 10.0) : 0);
  if (t < 5.9) darkness(0.85 - 0.23 * prog(t, 5.6, 5.9), 140, 1140, 900, true);   // Lampe klickt an
  else darkness(dark, 300, 1100, 950, true);
  fx.forEach((f) => f());
  // ganz am Ende sanft ausblenden
  const out = prog(t, LEN - 0.5, LEN);
  if (out > 0) { ctx.fillStyle = `rgba(255,247,250,${out})`; ctx.fillRect(0, 0, W, H); }
}

window.duration = LEN;
window.draw = (t) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); scene(t); };
window.draw(0);
</script>
</body></html>
