    <nav class="header-nav">
      <a href="/shop.html" class="header-link">Zum Shop</a>
      <button id="admin-logout" class="button secondary small" hidden>Abmelden</button>
    </nav>
  </header>

  <main class="admin">
    <h1 class="page-title">Admin</h1>

    <!-- Anmelden -->
    <form id="login-form" class="admin-card" hidden>
      <label for="password">Admin-Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Anmelden</button>
      <p id="login-message" class="admin-message" aria-live="polite"></p>
    </form>

    <div id="admin-panel" hidden>
      <!-- Besucherzahlen (ohne Cookies, backend/stats.py) -->
      <section class="admin-card">
        <h2>Besucher <span class="muted">letzte 30 Tage</span></h2>
        <div id="stats-totals" class="stats-totals"></div>
        <table id="stats-days" class="stats-table"></table>
        <p id="stats-sources" class="muted"></p>
        <p id="stats-shops" class="muted"></p>
      </section>

      <!-- Shop eintragen -->
      <form id="shop-form" class="admin-card">
        <h2>Neuen Shop eintragen</h2>
        <div class="admin-grid">
          <label>Plattform
            <select name="platform">
              <option value="ebay">eBay</option>
              <option value="etsy">Etsy</option>
              <option value="aliexpress">AliExpress</option>
            </select>
          </label>
          <label><span id="seller-label">Verkäufername</span><input name="seller" required maxlength="80"><small id="seller-hint" class="muted"></small></label>
          <label class="wide">Anzeigename<input name="name" required maxlength="80" placeholder="z.B. adidas Official Store"></label>
          <label class="wide">Notiz: warum geprüft (sehen Besucher auf der Detailseite)
            <textarea name="note" maxlength="300" rows="3" placeholder="z.B. Offizieller Markenstore, 99 % positive Bewertungen, Versand aus der EU."></textarea>
          </label>
        </div>

        <fieldset class="admin-checklist">
          <legend>Geprüft? (alles abhaken)</legend>
          <label><input type="checkbox" required> Originalware / offizieller Store (keine Fakes)</label>
          <label><input type="checkbox" required> Gute Bewertungen (viele, über längere Zeit)</label>
          <label><input type="checkbox" required> Versand in die EU</label>
          <label><input type="checkbox" required> Rückgabe möglich</label>
          <label><input type="checkbox" required> Kontakt / Impressum vorhanden</label>
        </fieldset>

        <div class="admin-actions">
          <button class="button" type="submit">Shop speichern</button>
        </div>
        <p id="form-message" class="admin-message" aria-live="polite"></p>
      </form>

      <h2>Alle geprüften Shops <span id="shop-count" class="muted"></span></h2>
      <div id="shop-list" class="shop-list"></div>
    </div>
  </main>
