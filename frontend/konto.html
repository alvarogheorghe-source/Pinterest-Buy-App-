<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Pinterest – Malipin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bunny.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">MALIPIN</a>
    <nav class="header-nav">
      <a href="/shop.html" class="header-link">Shop</a>
      <a href="/merkliste.html" class="header-link nav-saved" aria-label="Merkliste">♡ <span class="nav-label">Merkliste</span> <span class="saved-count"></span></a>
      <a href="/konto.html" class="header-link">Mein Pinterest</a>
    </nav>
  </header>

  <main class="narrow">
    <h1>Mein Pinterest</h1>
    <p id="status">Lade…</p>

    <!-- Sichtbar, solange der Nutzer NICHT verbunden ist -->
    <section id="login-section" hidden>
      <p>Verbinde dein Pinterest-Konto, damit wir deinen Stil aus deinen Boards ablesen können.</p>
      <a class="button" href="/auth/login">Mit Pinterest verbinden</a>
    </section>

    <!-- Sichtbar, sobald der Nutzer verbunden ist -->
    <section id="boards-section" hidden>
      <h2>Welche Boards zeigen deinen Stil?</h2>
      <ul id="board-list"></ul>
      <button id="save-button" class="button">Auswahl speichern</button>
      <button id="logout-button" class="button secondary">Verbindung trennen</button>
      <p id="save-message"></p>

      <h2>Deine Pins</h2>
      <button id="pins-button" class="button">Pins laden</button>
      <p id="pins-message" class="muted"></p>
      <p id="profile-text"></p>
      <p id="shop-link" hidden><a class="button" href="/shop.html">Passende Produkte ansehen →</a></p>
      <div id="pin-grid"></div>
    </section>

    <!-- 👍/👎: unabhängig von der Pinterest-Verbindung -->
    <section id="feedback-section">
      <h2>Deine Bewertungen</h2>
      <p id="feedback-text" class="muted">Lade…</p>
      <button id="feedback-reset" class="button secondary" hidden>Alle Bewertungen zurücksetzen</button>
    </section>
  </main>

  <script src="konto.js"></script>
  <script src="nav.js"></script>
  <!-- Mali, das Maskottchen -->
  <script src="bunny.js"></script>
</body>
</html>
